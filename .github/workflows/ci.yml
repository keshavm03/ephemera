name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The build must not depend on Redis being reachable: every route is
      # force-dynamic, so nothing here should try to talk to Upstash. A
      # placeholder secret is supplied so a build-time read cannot pass by luck.
      - name: Build
        run: npm run build
        env:
          SESSION_SECRET: ci-placeholder-secret-not-used-at-runtime
